<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Funis do Perpétuo</title>
<style>
:root{--fundo:#E9EDF2;--tinta:#23344F;--azul:#1B3A66;--borda:#AEBBCB;--suave:#5A6678;--alerta:#B4532A;--verde:#2F7D62;--amarelo:#B7861F;--lilas:#5B4B8A}
*{box-sizing:border-box;margin:0}
body{background:var(--fundo);color:var(--tinta);font-family:'DejaVu Sans',Verdana,-apple-system,sans-serif;padding:16px}
.wrap{max-width:1280px;margin:0 auto}
.barra{position:sticky;top:0;z-index:5;background:var(--fundo);padding:8px 0 10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.barra h1{font-size:1.25rem;font-weight:800;color:#1B2B45;margin-right:auto}
.abas{display:flex;gap:4px;flex-wrap:wrap}
.abas button,.btn,select,input[type=date],input[type=number],input[type=text]{font:inherit;font-size:.82rem;border:1px solid var(--borda);background:#fff;color:var(--tinta);border-radius:999px;padding:6px 12px;cursor:pointer}
input[type=date],input[type=number],input[type=text],select{border-radius:8px;padding:5px 8px;cursor:auto}
.abas button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn.prim{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn.peq{font-size:.72rem;padding:3px 9px}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem}
.filtros label{display:flex;gap:5px;align-items:center;color:var(--suave)}
.status{font-size:.8rem;color:var(--suave);margin:0 0 12px}
.status b{color:var(--tinta)} .status .aviso{color:var(--alerta);font-weight:700}
.folha{background:#fff;border-radius:10px;padding:20px 22px 16px;margin-bottom:16px}
.folha h3{font-size:1.25rem;font-weight:800;margin-bottom:4px;color:#1B2B45;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.folha h3 small{font-size:.78rem;font-weight:400;color:var(--suave)}
.folha .sub{font-size:.92rem;font-weight:800;margin-top:16px;color:#1B2B45}
.folha .sub small{font-weight:400;color:var(--suave)}
.tw{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.78rem;border:1px solid var(--borda)}
th{background:var(--azul);color:#fff;text-align:center;padding:5px 5px;font-weight:700;line-height:1.2;white-space:nowrap}
th:first-child{text-align:left;padding-left:10px}
th small{display:block;font-weight:400;font-size:.68rem;opacity:.9}
td{padding:3px 6px;border-bottom:1px solid var(--borda);border-left:1px solid var(--borda);text-align:center;color:#10233F;white-space:nowrap;height:22px}
td.lab{text-align:left;background:#F4F6F9;color:var(--tinta);font-weight:700}
td.esq{text-align:left;white-space:normal}
tr.tot td{font-weight:800;background:#E6EEF7}
tr.sem td{opacity:.55}
td.neg{color:var(--alerta);font-weight:700} td.pos{color:var(--verde);font-weight:700} td.amar{color:var(--amarelo);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.kpi{border:1px solid var(--borda);border-radius:8px;padding:8px 10px}
.kpi .v{font-size:1.25rem;font-weight:800;color:#1B2B45} .kpi .l{font-size:.7rem;color:var(--suave)} .kpi .s{font-size:.72rem;color:var(--suave)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.68rem;font-weight:700;margin:0 2px}
.pill.ok{background:#DDF1E7;color:#1F6B4E} .pill.off{background:#EEF0F3;color:#8A94A3} .pill.al{background:#FBE7DE;color:#9A4221} .pill.man{background:#E7E1F5;color:#4C3C80}
.funil{border:1px solid var(--borda);border-radius:8px;padding:10px 12px;margin-top:10px}
.funil h4{font-size:.9rem;font-weight:800;color:#1B2B45;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.funil h4 small{font-weight:400;color:var(--suave);font-size:.72rem}
.degraus{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:stretch}
.deg{min-width:96px;flex:1;border-radius:6px;background:#F4F6F9;padding:6px 8px;position:relative}
.deg .n{font-size:1.05rem;font-weight:800;color:#1B2B45} .deg .t{font-size:.66rem;color:var(--suave);line-height:1.2} .deg .c{font-size:.66rem;color:var(--lilas);font-weight:700}
.deg.mat{background:#DDF1E7} .deg.neg{background:#FFF4D6}
.form{font-size:.68rem;color:var(--suave);margin-top:8px;line-height:1.5}
.vazio{background:#fff;border-radius:10px;padding:30px;text-align:center;color:var(--suave)}
.linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.8rem}
.msg{font-size:.78rem;color:var(--verde);font-weight:700}
.bar{height:8px;background:#E6EEF7;border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--azul)}
@media (max-width:700px){body{padding:10px}.folha{padding:14px 12px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="barra">
    <h1>Funis do Perpétuo</h1>
    <div class="abas" id="abas">
      <button data-a="geral" class="on">Visão geral</button><button data-a="mentoria">Mentoria</button><button data-a="coortes">Coortes</button>
      <button data-a="campanhas">Campanhas</button><button data-a="filas">Filas</button><button data-a="config">Config</button>
    </div>
    <div class="filtros">
      <label>Período <select id="preset">
        <option value="mes">Mês atual</option><option value="mesant">Mês anterior</option><option value="base">Base set+out</option>
        <option value="7d">Últimos 7 dias</option><option value="30d">Últimos 30 dias</option><option value="custom">Personalizado</option></select></label>
      <label>de <input type="date" id="ini"></label><label>até <input type="date" id="fim"></label>
      <label id="lMent">Conta <select id="ment"></select></label>
      <button class="btn" id="ir">Atualizar</button>
    </div>
  </div>
  <div class="status" id="status">Carregando…</div>
  <div id="corpo"></div>
</div>
<script>
const API = "https://dqpxugdhlgafvddavzzp.supabase.co/functions/v1/dashboard-funis";
const K = new URLSearchParams(location.search).get("k") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (v,c=0) => (v==null||!isFinite(v)) ? "—" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c});
const R = (v,c=0) => (v==null||!isFinite(v)||v===0&&c===0&&false) ? "—" : "R$ "+nf(v,c);
const X = v => (v==null||!isFinite(v)) ? "—" : nf(v,2)+"×";
const P = (a,b) => (!b) ? "—" : nf(100*a/b,1)+"%";
const ddmm = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";
const dhm = s => s ? s.slice(8,10)+"/"+s.slice(5,7)+" "+s.slice(11,16) : "";
const hojeManaus = () => new Date(Date.now() - 4*3600e3).toISOString().slice(0,10);
const addDia = (d,n) => { const x = new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const FUNIL_NOME = {webinario:"Webinário", blindado:"Blindado", carrinho:"Carrinho abandonado", desconto:"Agente de desconto", nutricao:"Nutrição", organico:"Orgânico / isca", lowticket:"Low ticket (ingresso)", disparo:"Disparo · Anne vendedora", hubla:"Hubla (checkout direto)", outros:"Outros", direto:"Direto (sem evento em 7 dias)", captacao:"Captação (isca paga)", topo:"Topo (atração/corredor)", lancamento:"Lançamento", fora:"Fora das contas", black:"Black"};
const EV_NOME = {cadastro:"Cadastro", entrou:"Entrou na sala", pitch:"Chegou à oferta", clicou_checkout:"Clicou no botão", regua_enviada:"Régua enviada", controle:"Grupo de controle", clique_blindado:"Clicou p/ matricular (pop-up)", carrinho_abandonado:"Carrinho abandonado", checkout_aberto:"Checkout aberto", disparo_enviado:"Disparo enviado", roteado:"Roteado p/ agente", respondeu:"Respondeu", escalado_humano:"Escalado p/ humano", link_enviado:"Link enviado", venda_anne:"Venda confirmada (Anne)", matricula:"Matrícula", reembolso:"Reembolso", isca_cadastro:"Cadastro na isca", grupo_entrou:"Entrou no grupo", jev_classe:"Classe Jev", aula_assistida:"Aula assistida (≥50%)", nutricao_quente:"2 aulas em 7 d → vendedor"};
const EV_ORDEM = ["disparo_enviado","regua_enviada","controle","cadastro","isca_cadastro","roteado","entrou","grupo_entrou","aula_assistida","nutricao_quente","pitch","respondeu","jev_classe","clicou_checkout","clique_blindado","escalado_humano","carrinho_abandonado","checkout_aberto","link_enviado","venda_anne","matricula","reembolso"];
const FUNIL_ORDEM = ["webinario","blindado","carrinho","desconto","disparo","nutricao","organico","lowticket","hubla","outros"];
const SEQ = {webinario:["cadastro","entrou","pitch","clicou_checkout","link_enviado"], blindado:["clique_blindado","regua_enviada","link_enviado"], carrinho:["carrinho_abandonado","regua_enviada","link_enviado"],
  desconto:["disparo_enviado","respondeu","link_enviado"], disparo:["disparo_enviado","respondeu","link_enviado","escalado_humano"], nutricao:["disparo_enviado","isca_cadastro","grupo_entrou","aula_assistida","nutricao_quente","respondeu","link_enviado"],
  organico:["isca_cadastro","grupo_entrou","aula_assistida","nutricao_quente","respondeu","link_enviado"], lowticket:["regua_enviada","respondeu","link_enviado"], hubla:["checkout_aberto"], outros:["disparo_enviado","respondeu","link_enviado"]};
const TIPO_FILA = {lead_novo:"Lead novo sem 1º toque", carrinho:"Carrinho sem toque", negociacao:"Negociação parada (sem pagamento)", classe_a:"Classe A parada há 48 h"};
let ABA = "geral", MENTORIAS = [], CACHE = {};

async function api(v, extra){ const r = await fetch(API+"?k="+encodeURIComponent(K)+"&v="+v+(extra||"")); const j = await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j; }
async function post(body){ const r = await fetch(API+"?k="+encodeURIComponent(K), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); const j = await r.json(); if(!r.ok) throw new Error(j.error||r.status); return j; }
const periodo = () => "&ini="+$("ini").value+"&fim="+$("fim").value;

function aplicarPreset(){
  const h = hojeManaus(), ontem = addDia(h,-1), p = $("preset").value;
  if(p==="mes"){ $("ini").value = h.slice(0,8)+"01"; $("fim").value = ontem < h.slice(0,8)+"01" ? h : ontem; }
  else if(p==="mesant"){ const m1 = addDia(h.slice(0,8)+"01",-1); $("ini").value = m1.slice(0,8)+"01"; $("fim").value = m1; }
  else if(p==="base"){ $("ini").value = "2026-09-01"; $("fim").value = ontem; }
  else if(p==="7d"){ $("ini").value = addDia(h,-7); $("fim").value = ontem; }
  else if(p==="30d"){ $("ini").value = addDia(h,-30); $("fim").value = ontem; }
}
$("preset").onchange = () => { aplicarPreset(); carregar(); };
$("ini").onchange = $("fim").onchange = () => { $("preset").value = "custom"; };
$("ir").onclick = () => { CACHE = {}; carregar(); };
$("ment").onchange = () => carregar();
$("abas").onclick = e => { const b = e.target.closest("button"); if(!b) return; ABA = b.dataset.a; [...$("abas").children].forEach(x => x.classList.toggle("on", x===b)); carregar(); };

async function iniciar(){
  if(!K){ $("status").innerHTML = '<span class="aviso">Falta o token no link (?k=…).</span>'; return; }
  aplicarPreset();
  const h = location.hash.slice(1); if(["geral","mentoria","coortes","campanhas","filas","config"].includes(h)){ ABA = h; [...$("abas").children].forEach(x => x.classList.toggle("on", x.dataset.a===h)); }
  carregar();
}

async function carregar(){
  history.replaceState(null, "", location.search + "#" + ABA);
  $("lMent").style.display = (ABA==="mentoria"||ABA==="coortes") ? "" : "none";
  $("status").textContent = "Carregando…";
  try {
    if(ABA==="geral") await vGeral();
    else if(ABA==="mentoria") await vMentoria();
    else if(ABA==="coortes") await vCoortes();
    else if(ABA==="campanhas") await vCampanhas();
    else if(ABA==="filas") await vFilas();
    else if(ABA==="config") await vConfig();
  } catch(e){ $("status").innerHTML = '<span class="aviso">Erro: '+esc(e.message)+'</span>'; $("corpo").innerHTML = ""; }
}
function mentoriasSelect(lista){
  MENTORIAS = lista; const s = $("ment"); const atual = s.value;
  s.innerHTML = lista.map(m => `<option value="${m.mentoria||m.codigo}">${esc(m.nome)}</option>`).join("");
  if(lista.some(m => (m.mentoria||m.codigo)===atual)) s.value = atual;
}
function statusPeriodo(j, extra){
  $("status").innerHTML = `Período <b>${ddmm(j.ini)} → ${ddmm(j.fim)}</b>` + (j.atualizado ? ` · eventos até <b>${esc(dhm(j.atualizado))}</b>` : "") + (extra||"");
}

// ---------------------------------------------------------------- Visão geral
async function vGeral(){
  const j = await api("resumo", periodo());
  mentoriasSelect(j.mentorias);
  const eb = j.excluido_black || {};
  statusPeriodo(j, ` · Black excluída: ${eb.vendas||0} vendas, ${R(eb.receita)} de receita, ${R(eb.gasto)} de custo`);
  const ativas = j.mentorias.filter(m => m.meta_habilitada);
  const tot = {};
  for (const k of ["leads","oportunidades","negociacoes","matriculas","matriculas_especial","reembolsos","receita_1a","gasto_funil","gasto_mentoria","fechamento_anne","fechamento_humano","fechamento_sozinho","meta_matriculas"]) tot[k] = ativas.reduce((a,m)=>a+(+m[k]||0),0);
  const linha = (m, isTot) => {
    const s = m.sugestao||{};
    const meta = isTot ? (tot.meta_matriculas ? nf(tot.meta_matriculas) : "—") : (m.meta_matriculas!=null ? nf(m.meta_matriculas) : '<span class="pill off">sem meta</span>');
    const sug = isTot ? "" : (s.sugestao!=null ? `${nf(s.sugestao)} <small style="color:#5A6678">(${s.fonte_verba==="plano"?"plano":"gasto 30d"})</small>` : "—");
    const alvo = m.meta_matriculas!=null ? m.meta_matriculas : (s.sugestao!=null ? s.sugestao : null);
    const cls = alvo==null ? "" : (m.matriculas >= alvo ? "pos" : (m.matriculas >= 0.8*alvo ? "amar" : "neg"));
    const est = isTot ? "" : (!m.meta_habilitada ? '<span class="pill off">conta nova</span>' :
      (m.estrutura.webinario||m.estrutura.captacao||m.estrutura.topo ? "" : '<span class="pill al">sem funil de topo</span>') +
      ['webinario','blindado','captacao','topo'].map(f => `<span class="pill ${m.estrutura[f]?'ok':'off'}">${({webinario:'WEB',blindado:'BLIND',captacao:'CAPT',topo:'TOPO'})[f]}</span>`).join(""));
    return `<tr class="${isTot?'tot':(m.meta_habilitada?'':'sem')}">
      <td class="lab">${isTot ? 'Total (contas com meta)' : `<a href="#mentoria" onclick="irMentoria('${m.mentoria}');return false" style="color:inherit">${esc(m.nome)}</a>`}</td>
      <td>${meta}</td><td>${sug}</td>
      <td class="${cls}">${nf(m.matriculas)}${m.matriculas_especial?` <small>+${m.matriculas_especial} esp.</small>`:""}${m.reembolsos?` <small style="color:#B4532A">−${m.reembolsos} reemb.</small>`:""}</td>
      <td>${R(m.receita_1a)}</td>
      <td>${R(m.gasto_funil)} / ${R(m.gasto_mentoria)}</td>
      <td>${isTot ? (tot.matriculas? R(tot.gasto_funil/tot.matriculas)+" / "+R(tot.gasto_mentoria/tot.matriculas) : "—") : (m.matriculas&&m.gasto_mentoria ? R(m.cpa_funil)+" / "+R(m.cpa_mentoria) : "—")}</td>
      <td>${isTot ? X(tot.gasto_mentoria? tot.receita_1a/tot.gasto_mentoria : null) : X(m.roas)}</td>
      <td>${nf(m.leads)} → ${nf(m.oportunidades)} → ${nf(m.negociacoes)} → ${nf(m.matriculas)}<br><small>${P(m.oportunidades,m.leads)} · ${P(m.negociacoes,m.oportunidades)} · ${P(m.matriculas,m.negociacoes)}</small></td>
      <td>${nf(m.fechamento_anne)} / ${nf(m.fechamento_humano)} / ${nf(m.fechamento_sozinho)}</td>
      <td class="esq">${est}</td></tr>`;
  };
  $("corpo").innerHTML = `<div class="folha"><h3>As 9 contas <small>matrículas = 1ª parcela paga, sem reembolso, sem Black · custo = Meta × 1,1383</small></h3>
    <div class="tw"><table><tr><th>Conta</th><th>Meta<small>fixada</small></th><th>Sugestão<small>verba ÷ CPA base</small></th><th>Matrículas</th><th>Receita<small>1ª parcela líq.</small></th>
    <th>Gasto<small>funil / mentoria</small></th><th>Custo por aluno<small>funil / mentoria</small></th><th>ROAS</th><th>Leads → Oport. → Negoc. → Matr.<small>conversão entre etapas</small></th><th>Fechamento<small>Anne / humano / sozinho</small></th><th>Estrutura</th></tr>
    ${j.mentorias.map(m => linha(m,false)).join("")}${linha(tot,true)}</table></div>
    <div class="form">Lead = pessoa com telefone que entrou por cadastro, clique, carrinho, isca ou disparo no período · Oportunidade = conversou com necessidade ou clicou para matricular · Negociação = link enviado, checkout aberto, carrinho ou data combinada · Especial = venda em janela de lançamento/ação (fora da taxa base) · "sem funil de topo" = sem webinário, captação nem atração no período.</div>
    ${j.periodos.length ? `<div class="form">Períodos especiais no intervalo: ${j.periodos.map(p => esc((p.mentoria||'todas')+' · '+p.tipo+' '+ddmm(p.ini)+'→'+ddmm(p.fim)+' · '+(p.descricao||''))).join(" | ")}</div>` : ""}
  </div>`;
}
function irMentoria(m){ ABA = "mentoria"; [...$("abas").children].forEach(x => x.classList.toggle("on", x.dataset.a==="mentoria")); $("ment").value = m; carregar(); }

// ---------------------------------------------------------------- Mentoria
async function vMentoria(){
  if(!MENTORIAS.length){ const c = await api("config"); mentoriasSelect(c.mentorias); }
  const m = $("ment").value || "TJAM";
  const j = await api("mentoria", periodo()+"&m="+m);
  statusPeriodo(j);
  const r = j.resumo || {}, s = j.sugestao || {};
  const porFunil = {};
  for (const e of j.etapas){ (porFunil[e.funil] = porFunil[e.funil] || []).push(e); }
  const vf = Object.fromEntries(j.vendas_funil.map(v => [v.funil_conversao, v]));
  const ctl = {}; for (const c of j.controle){ (ctl[c.funil] = ctl[c.funil] || {})[c.grupo] = c; }
  const funis = FUNIL_ORDEM.filter(f => porFunil[f] || vf[f]).concat(Object.keys(porFunil).filter(f => !FUNIL_ORDEM.includes(f)));
  const cardFunil = f => {
    const todos = (porFunil[f]||[]).filter(e => !["matricula","reembolso","jev_classe"].includes(e.event_type));
    const seq = (SEQ[f]||[]).map(t => todos.find(e => e.event_type===t)).filter(Boolean);
    const resto = todos.filter(e => !seq.includes(e)).sort((a,b)=>EV_ORDEM.indexOf(a.event_type)-EV_ORDEM.indexOf(b.event_type));
    const jev = (porFunil[f]||[]).filter(e => e.event_type==="jev_classe");
    const v = vf[f]; const c = ctl[f];
    const degs = seq.map((e,i) => { const ant = seq[i-1]; return `<div class="deg ${e.etapa==='negociacao'?'neg':''}"><div class="n">${nf(e.pessoas)}</div><div class="t">${esc(EV_NOME[e.event_type]||e.event_type)}</div>${ant?`<div class="c">${P(e.pessoas,ant.pessoas)}</div>`:""}</div>`; }).join("");
    const ult = seq[seq.length-1];
    const mat = v ? `<div class="deg mat"><div class="n">${nf(v.n)}</div><div class="t">Matrículas fechadas por este funil</div><div class="c">${ult?P(v.n,ult.pessoas)+" do degrau anterior · ":""}${R(v.liq)} · Anne ${v.anne} · humano ${v.humano} · sozinho ${v.sozinho}${v.dias_medio!=null?` · ${v.dias_medio} d`:""}</div></div>` : `<div class="deg mat"><div class="n">0</div><div class="t">Matrículas fechadas por este funil</div></div>`;
    const ctlTxt = c ? `<small>Régua: ${c.regua_enviada?nf(c.regua_enviada.pessoas)+" pessoas · "+P(c.regua_enviada.compraram,c.regua_enviada.pessoas)+" compraram em 14 d":"—"} · Controle: ${c.controle?nf(c.controle.pessoas)+" · "+P(c.controle.compraram,c.controle.pessoas):"sem grupo de controle no período"}</small>` : "";
    const jevTxt = jev.length ? `<small>Jev: ${jev.map(x => (x.etapa==='perfil'?'A/B ':'C/D ')+nf(x.pessoas)).join(" · ")}</small>` : "";

async function salvarCamp(b){ const tr = b.closest("tr"); b.disabled = true; try { await post({acao:"campanha", campaign_id: tr.dataset.id, mentoria: tr.querySelector(".cM").value, funil: tr.querySelector(".cF").value}); b.textContent = "Salvo"; setTimeout(vCampanhas, 600); } catch(e){ alert(e.message); b.disabled=false; } }

      <div class="kpi"><div class="v">${nf(esq.length)}</div><div class="l">leads em posse esquecidos</div><div class="s">sem próxima ação em ${cfg.proxima_acao_horas||24} h ou ação vencida</div></div>

  <div class="folha"><h3>Prazos de "lead esquecido" <small>minutos</small></h3>
    <div class="tw"><table><tr><th>Etapa</th><th>Descrição</th><th>Minutos</th><th></th></tr>
    ${j.prazos.map(p => `<tr><td class="lab">${esc(p.etapa)}</td><td class="esq">${esc(p.descricao||'')}</td><td><input type="number" style="width:90px" value="${p.minutos}" data-e="${p.etapa}" class="iPrazo"></td><td><button class="btn peq" onclick="salvarPrazo(this)">ok</button></td></tr>`).join("")}</table></div></div>
  <div class="folha"><h3>Agentes da Anne → conta e funil</h3><div class="tw"><table><tr><th>Agente</th><th>Conta</th><th>Funil</th></tr>${j.agentes.map(a => `<tr><td class="lab">${esc(a.agent_slug)}</td><td>${esc(a.mentoria||'—')}</td><td>${esc(a.funil)}</td></tr>`).join("")}</table></div>
    <div class="form">Regras de reconhecimento das contas (campanha e produto) e dos agentes mudam por migration, não aqui.</div></div>`;
  desenharCv2();
}
async function desenharCv2(){
  const c = await api("comercial").catch(e => ({error:e.message}));
  if(c.error){ $("cv2").innerHTML = '<span class="aviso">'+esc(c.error)+'</span>'; return; }
  const k = c.cfg||{};
  const chk = (id,v,lab) => `<label><input type="checkbox" id="${id}" ${v?'checked':''}> ${lab}</label>`;
  const num = (id,v,lab) => `<label>${lab} <input type="number" id="${id}" value="${v??''}" style="width:70px"></label>`;
  $("cv2").innerHTML = `<div class="linha">
    ${chk('cvAtivo', k.ativo, '<b>Distribuição automática ligada</b> (o banco entrega a fila aos closers até o teto)')}
    ${chk('cvInbox', k.inbox_vendedor_proprio, '<b>Inbox só do vendedor</b> (vendedor vê só os leads dele, a fila "a atribuir" e escalações sem dono)')}
    ${chk('cvAlerta', k.alertas_whatsapp, 'Alertas no seu WhatsApp (classe A sem resposta · fila acima do teto)')}</div>
    <div class="linha">${num('cvTeto', k.teto_dia, 'teto/dia')} ${num('cvPosse', k.posse_dias, 'posse (dias)')} ${num('cvNeg', k.negociacao_horas, 'negociação travada (h)')} ${num('cvA', k.classe_a_horas, 'classe A parada (h)')} ${num('cvEsc', k.escalacao_minutos, 'escalação sem dono (min)')} ${num('cvPA', k.proxima_acao_horas, 'sem próxima ação (h)')} ${num('cvAh', k.alerta_classe_a_horas, 'alerta classe A (h)')}
      <button class="btn prim peq" onclick="salvarCv2(this)">Salvar flags</button></div>
    <div class="linha"><button class="btn peq" onclick="tickCv2(this)">Rodar varredura agora</button>
      <button class="btn peq" onclick="limpezaCv2(this,false)">Limpeza inicial: simular (posse sem trabalho há 14 d)</button>
      <button class="btn peq" onclick="limpezaCv2(this,true)">Limpeza inicial: APLICAR</button> <span id="cv2msg" class="msg"></span></div>
    <div class="form">Roleta semanal encerrada em 24/10 (decisão Q36). Fila detectada a cada 5 min mesmo com a distribuição desligada, para você ver antes de ligar. Última leitura: ${esc(dhm(c.gerado_em))} · alertas nas últimas 24 h: ${nf(c.alertas_24h)}.</div>`;
}
async function salvarCv2(b){ b.disabled=true; try { const r = await post({acao:"cv2_cfg", ativo:$("cvAtivo").checked, inbox_vendedor_proprio:$("cvInbox").checked, alertas_whatsapp:$("cvAlerta").checked,
    teto_dia:+$("cvTeto").value, posse_dias:+$("cvPosse").value, negociacao_horas:+$("cvNeg").value, classe_a_horas:+$("cvA").value, escalacao_minutos:+$("cvEsc").value, proxima_acao_horas:+$("cvPA").value, alerta_classe_a_horas:+$("cvAh").value});
    $("cv2msg").textContent = r.ok ? "flags salvas" : JSON.stringify(r); } catch(e){ $("cv2msg").textContent = "erro: "+e.message; } b.disabled=false; }
async function tickCv2(b){ b.disabled=true; try { const r = await post({acao:"cv2_tick"}); $("cv2msg").textContent = `varredura: ${r.detectar?.novos} novos na fila · ${r.distribuir?.atribuidos} atribuídos · ${r.expirar?.recuperacao_posse+r.expirar?.recuperacao_b} p/ recuperação`; desenharCv2(); } catch(e){ $("cv2msg").textContent = "erro: "+e.message; } b.disabled=false; }
async function limpezaCv2(b, aplicar){ if(aplicar && !confirm("Encerrar a posse de TODOS os cards ativos sem trabalho há 14 dias e mandar para a recuperação?")) return; b.disabled=true;
  try { const r = await post({acao:"cv2_limpeza", dias:14, aplicar}); $("cv2msg").textContent = (aplicar?"APLICADO: ":"simulação: ")+r.total+" cards"+(r.por_vendedor?" · "+Object.entries(r.por_vendedor).map(([k,v])=>k+" "+v).join(", "):""); } catch(e){ $("cv2msg").textContent = "erro: "+e.message; } b.disabled=false; }
async function salvarMeta(b){ const td = b.closest("td"); const im = td.querySelector(".iMeta"), iv = td.querySelector(".iVerba"); b.disabled = true;
  try { await post({acao:"meta", mentoria: im.dataset.m, mes: im.dataset.mes, meta_matriculas: im.value, verba_prevista: iv.value, por:"painel"}); b.textContent = "salvo"; setTimeout(()=>{b.textContent="ok"; b.disabled=false;}, 1200); } catch(e){ alert(e.message); b.disabled=false; } }
async function salvarPrazo(b){ const i = b.closest("tr").querySelector(".iPrazo"); b.disabled = true; try { await post({acao:"prazo", etapa: i.dataset.e, minutos: i.value}); b.textContent="salvo"; setTimeout(()=>{b.textContent="ok"; b.disabled=false;},1200); } catch(e){ alert(e.message); b.disabled=false; } }
async function novoPeriodo(b){ b.disabled = true; try { await post({acao:"periodo", mentoria: $("pM").value, tipo: $("pT").value, ini: $("pI").value, fim: $("pF").value, descricao: $("pD").value}); vConfig(); } catch(e){ alert(e.message); b.disabled=false; } }
async function apagarPeriodo(id, b){ if(!confirm("Apagar este período?")) return; b.disabled = true; try { await post({acao:"periodo_apagar", id}); vConfig(); } catch(e){ alert(e.message); b.disabled=false; } }
async function refreshAgora(b){ b.disabled = true; b.textContent = "reprocessando…"; try { const r = await post({acao:"refresh", dias:3}); b.textContent = `feito (${r.eventos} eventos, ${r.vendas} vendas)`; } catch(e){ b.textContent = "erro: "+e.message; } }

iniciar();
</script>
</body>
</html>
